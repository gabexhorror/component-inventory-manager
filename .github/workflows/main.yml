name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3 python3-dev ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev \
          libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
          cmake autoconf automake libtool pkg-config zip unzip
        pip install python-for-android cython==0.29.33
    
    - name: Build APK with P4A
      run: |
        p4a apk \
          --private . \
          --package=org.test.componentinventory \
          --name "Component Inventory" \
          --version 1.0 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy==2.2.1 \
          --permission INTERNET \
          --orientation=portrait \
          --arch=arm64-v8a \
          --sdk-dir=/home/runner/.android \
          --ndk-dir=/home/runner/.android/ndk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: component-inventory-apk
        path: "*.apk"
